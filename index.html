<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Five senses W puzzle</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    max-width: 520px;
    margin: 40px auto;
    padding: 0 16px;
    color: #1a1a1a;
    background: #ffffff;
  }
  table {
    border-collapse: collapse;
    width: 100%;
    font-size: 14px;
  }
  th, td {
    border-bottom: 1px solid #ddd;
    padding: 8px 4px;
    text-align: center;
  }
  th {
    font-weight: 600;
  }
  td:first-child, th:first-child {
    text-align: left;
  }
  td:first-child {
    font-style: italic;
  }
  button.cell {
    width: 30px;
    height: 30px;
    padding: 0;
    border: 1px solid #bbb;
    border-radius: 6px;
    background: #f5f5f5;
    cursor: pointer;
    font-size: 14px;
  }
  button.cell.correct {
    background: #1D9E75;
    border-color: #0f6e56;
    color: #fff;
  }
  button.cell.wrong {
    background: #F09595;
    border-color: #A32D2D;
  }
  #status {
    margin-top: 12px;
    font-size: 14px;
    color: #555;
  }
  #reveal {
    display: none;
    margin-top: 24px;
    text-align: center;
  }
</style>
</head>
<body>

<h2 style="font-size: 18px; font-weight: 600;">Beyond What Can Be Seen</h2>
<p style="font-size: 14px; color: #555;">Tap every sense that matches each row. Some rows need more than one.</p>

<table>
<thead>
<tr>
<th></th>
<th>Hearing</th>
<th>Smell</th>
<th>Touch</th>
<th>Taste</th>
<th>Sight</th>
</tr>
</thead>
<tbody id="grid-body"></tbody>
</table>

<div id="status">Tap every sense that matches each row. Some rows need more than one.</div>

<div id="reveal">
<svg viewBox="0 0 200 120" style="width:160px; height:auto;" role="img">
<title>The letter W</title>
<polyline points="10,10 55,110 100,40 145,110 190,10" fill="none" stroke="#1D9E75" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
</div>

<script>
var rows = [
  {w:"roar / hidden", s:[0,4]},
  {w:"sound / waterfall", s:[0,4]},
  {w:"cooling", s:[2]},
  {w:"spray", s:[2]},
  {w:"scent / fresh", s:[1,3]},
  {w:"earthy / pure", s:[1,3]}
];
var senses = ["Hearing","Smell","Touch","Taste","Sight"];
var picked = rows.map(function(){ return []; });
var tbody = document.getElementById("grid-body");

rows.forEach(function(r, ri) {
  var tr = document.createElement("tr");
  var td0 = document.createElement("td");
  td0.textContent = r.w;
  tr.appendChild(td0);
  for (var ci = 0; ci < 5; ci++) {
    (function(ci) {
      var td = document.createElement("td");
      var btn = document.createElement("button");
      btn.className = "cell";
      btn.setAttribute("aria-label", "Toggle " + r.w + " match with " + senses[ci]);
      btn.onclick = function() {
        var arr = picked[ri];
        var idx = arr.indexOf(ci);
        if (idx === -1) { arr.push(ci); } else { arr.splice(idx, 1); }
        render();
      };
      td.appendChild(btn);
      tr.appendChild(td);
    })(ci);
  }
  tbody.appendChild(tr);
});

function sameSet(a, b) {
  if (a.length !== b.length) return false;
  var sa = a.slice().sort();
  var sb = b.slice().sort();
  for (var i = 0; i < sa.length; i++) { if (sa[i] !== sb[i]) return false; }
  return true;
}

function render() {
  var trs = tbody.querySelectorAll("tr");
  var solvedRows = 0;
  trs.forEach(function(tr, ri) {
    var btns = tr.querySelectorAll("button.cell");
    var sel = picked[ri];
    btns.forEach(function(btn, ci) {
      var isPicked = sel.indexOf(ci) !== -1;
      var isCorrect = rows[ri].s.indexOf(ci) !== -1;
      btn.classList.remove("correct", "wrong");
      btn.innerHTML = "";
      if (isPicked && isCorrect) {
        btn.classList.add("correct");
        btn.innerHTML = "&#10003;";
      } else if (isPicked && !isCorrect) {
        btn.classList.add("wrong");
      }
    });
    if (sameSet(sel, rows[ri].s)) solvedRows++;
  });
  var status = document.getElementById("status");
  var reveal = document.getElementById("reveal");
  if (solvedRows === rows.length) {
    status.textContent = "All matched.";
    status.style.color = "#0f6e56";
    reveal.style.display = "block";
  } else {
    status.textContent = solvedRows + " of " + rows.length + " rows fully matched.";
    status.style.color = "#555";
    reveal.style.display = "none";
  }
}
render();
</script>

</body>
</html>
